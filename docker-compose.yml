services:
  iapi-db:
    image: postgres:17-alpine
    container_name: iapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - iapi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  iapi-server:
    build: .
    container_name: iapi-server
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 30s
    ports:
      # Por defecto solo accesible desde el propio servidor; para exponerla use un proxy con TLS
      - "${IAPI_BIND_ADDRESS:-127.0.0.1}:3100:3100"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@iapi-db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      iapi-db:
        condition: service_healthy

volumes:
  iapi_pgdata:
